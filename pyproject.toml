[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cre-monitor"
version = "0.1.0"
description = "LangGraph agent PoC that monitors the London commercial real estate (office) market using pluggable skills."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "London FDE team" }]
dependencies = [
    # --- Agent framework -------------------------------------------------
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    # --- Data access -------------------------------------------------------
    "tavily-python>=0.5",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=4.0",
    "feedparser>=6.0",
    # --- Config / parsing --------------------------------------------------
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # --- Reporting ---------------------------------------------------------
    "pandas>=2.2",
    "plotly>=5.22",
    "kaleido>=1.0",  # PNG export; uses a local Chrome/Chromium (run `plotly_get_chrome` if none)
    "jinja2>=3.1",
    "markdown>=3.6",
    "openpyxl>=3.1",  # Excel workbook in `cre-monitor export`
    # --- Interfaces --------------------------------------------------------
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",     # lint: `ruff check src tests evals scripts`
    "vulture>=2.11", # dead code: `vulture src --min-confidence 70`
]
# LangGraph Studio / `langgraph dev` server (heavy: pulls grpc etc.).
studio = [
    "langgraph-cli[inmem]>=0.2",
]

[project.scripts]
cre-monitor = "cre_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cre_monitor = ["reporting/templates/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# F: pyflakes (unused/undefined names); E9: syntax; B: likely bugs; UP: modern syntax; SIM/PIE: simplifications;
# RUF: ruff-specific; BLE: blind `except Exception` must be marked deliberate (# noqa: BLE001 + reason);
# E731: lambda assignment (allowed where marked).
select = ["F", "E9", "E731", "B", "BLE", "UP", "SIM", "PIE", "RUF"]
ignore = [
    "E501",    # long lines: formatting is not enforced
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: £, –, emoji are intentional
    "RUF012",  # mutable class defaults: pydantic models handle them
    "UP042",   # (str, Enum) kept: StrEnum would change str() of values used in templates
    "SIM108", "SIM105",  # ternaries / contextlib.suppress: clarity first
    "B008",    # typer.Option in defaults is typer's documented pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each marker is applied automatically to the tests in the folder of the same name
# (tests/conftest.py), e.g. `pytest -m unit` == `pytest tests/unit`.
markers = [
    "unit: one module in isolation (tests/unit)",
    "integration: several components together, incl. fake-LLM agent loops and CLI (tests/integration)",
    "e2e: whole-pipeline brief / chat journeys (tests/e2e)",
    "ui: Streamlit app via AppTest (tests/ui)",
    "regression: reproductions of fixed bugs (tests/regression)",
    "live: hits real external APIs / LLMs; requires API keys (deselected by default)",
]
addopts = "-m 'not live'"
